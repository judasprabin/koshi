<input type="hidden" id="ctl00_PlaceHolderMain_PageSchemaHiddenField_Input" value="{&quot;content&quot;:[{&quot;text&quot;:&quot;Overview&quot;,&quot;block&quot;:&quot;\u003cp\u003eInvitation rounds will be run by the Department of Home Affairs periodically during the program year for:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eSkilled Independent visa (subclass 189)\u003c/li\u003e\n\t\u003cli\u003eSkilled Work Regional (Provisional) visa (subclass 491) \u0026ndash; Family Sponsored.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eIt is important to note that not everyone who submits an Expression of Interest (EOI) through SkillSelect will receive an invitation to apply for a visa. The number of invitations and occupations in each invitation round varies depending on the needs of the Australian economy and on the number of applications already on-hand with the Department.\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003eState or territory government nominations for skilled visas such as the Skilled Nominated visa (subclass 190) and Skilled Work Regional (Provisional) visa (subclass 491) will not be affected by the departmental invitation rounds. State and Territory governments manage their nominations in line with their own priorities.\u003c/p\u003e\n\n\u003cp\u003eFor results of previous\u0026nbsp;SkillSelect invitation rounds, see \u003ca href=\&quot;/visas/working-in-australia/skillselect/previous-rounds\&quot;\u003ePrevious rounds\u003c/a\u003e.\u003c/p\u003e\n&quot;},{&quot;text&quot;:&quot;Occupation ceilings&quot;,&quot;block&quot;:&quot;\u003cp\u003eAn \u0026#39;occupation ceiling\u0026#39; means there may be an upper limit on how many EOIs\u0026nbsp;with a specific occupation\u0026nbsp;we can invite from an occupation group. This ensures that the skilled migration program meets the priorities set by the Australia Government, remains balanced, and continues to invite a diverse range of skilled occupations:\u003c/p\u003e\n\n\u003cp\u003eOccupation ceilings \u003cstrong\u003edo not apply\u003c/strong\u003e to these visa subclasses:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eSkilled Nominated visa (subclass 190)\u003c/li\u003e\n\t\u003cli\u003eSkilled Work Regional (Provisional) visa (subclass 491) \u0026ndash; State and Territory Nominated\u003c/li\u003e\n\u003c/ul\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Invitation process&quot;,&quot;block&quot;:&quot;\u003ch4\u003eSkilled Independent visa (subclass 189) and Skilled Work Regional (Provisional) visa (subclass 491) \u0026ndash; Family Sponsored\u003c/h4\u003e\n\n\u003cp\u003eThe highest ranked EOI, by points score, will be invited to apply for their visa before an EOI with a lower points score.\u003c/p\u003e\n\n\u003cp\u003eFor EOIs with\u0026nbsp;equal points scores, we will determine the time and date at which the EOI reached its score for that subclass. We call this a \u0026lsquo;tie break\u0026rsquo; or the \u0026lsquo;date of effect\u0026rsquo;. The EOI with an earlier date of effect will be invited before EOIs with a later date of effect.\u003c/p\u003e\n\n\u003ch4\u003eSkilled Nominated visa (subclass 190) and Skilled Work Regional (Provisional) visa (subclass 491) \u0026ndash; State and Territory Nominated\u003c/h4\u003e\n\n\u003cp\u003eRelevant state and territory government agencies view EOIs in SkillSelect and decide whether to nominate candidates for the Skilled Nominated visa (subclass 190) or Skilled Work Regional (Provisional) (subclass 491) visa. When a state or territory government nominates a candidate in SkillSelect, it triggers an invitation to be issued. Contact details for state government agencies can be found on their respective websites, links to which can be found\u0026nbsp;\u003ca href=\&quot;/what-we-do/state-and-territory-nomination-allocations\&quot;\u003eon our website.\u003c/a\u003e\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Current round&quot;,&quot;block&quot;:&quot;\u003ch3 id=\&quot;invitations-issued-13062024\&quot;\u003eInvitations issued on 4 June 2026\u003c/h3\u003e\n\n\u003cp\u003eThe table below shows the number of EOIs invited, and the tie break month and year, for the SkillSelect invitation round on 4 June 2026.\u003c/p\u003e\n\n\u003cdiv class=\&quot;table-responsive\&quot;\u003e\n\u003ctable\u003e\n\t\u003cthead\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003cth\u003eVisa subclass\u003c/th\u003e\n\t\t\t\u003cth\u003eTotal EOIs Invited\u003c/th\u003e\n\t\t\t\u003cth\u003eTie break date - month and year\u003c/th\u003e\n\t\t\u003c/tr\u003e\n\t\u003c/thead\u003e\n\t\u003ctbody\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e\n\t\t\t\u003cp\u003e\u003ca href=\&quot;https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/skilled-independent-189\&quot;\u003eSkilled Independent visa (subclass 189)\u003c/a\u003e\u003c/p\u003e\n\t\t\t\u003c/td\u003e\n\t\t\t\u003ctd\u003e\n\t\t\t\u003cp\u003e10,000\u003c/p\u003e\n\t\t\t\u003c/td\u003e\n\t\t\t\u003ctd\u003e\n\t\t\t\u003cp\u003e24/04/2026\u003c/p\u003e\n\t\t\t\u003c/td\u003e\n\t\t\u003c/tr\u003e\n\t\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/div\u003e\n\n\u003ch3 id=\&quot;invitations-issued-21082025\&quot;\u003eInvitations issued by occupation and minimum score invited\u003c/h3\u003e\n\n\u003cdiv class=\&quot;table-responsive\&quot;\u003e\n\u003ctable\u003e\n\t\u003cthead\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e\n\t\t\t\u003cp\u003e\u003cstrong\u003eOccupation*\u003c/strong\u003e\u003c/p\u003e\n\t\t\t\u003c/td\u003e\n\t\t\u003c/tr\u003e\n\t\u003c/thead\u003e\n\t\u003ctbody\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e\n\t\t\t\u003cp\u003eActuary\u003c/p\u003e\n\t\t\t\u003c/td\u003e\n\t\t\t\u003ctd\u003e\n\t\t\t\u003cp\u003e90\u003c/p\u003e\n\t\t\t\u003c/td\u003e\n\t\t\u003c/tr\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e\n\t\t\t\u003cp\u003eAgricultural Consultant\u003c/p\u003e\n\t\t\t\u003c/td\u003e\n\t\t\t\u003ctd\u003e\n\t\t\t\u003cp\u003e80\u003c/p\u003e\n\t\t\t\u003c/td\u003e\n\t\t\u003c/
